<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="畑ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>畑ノート</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#1f2a1f;--sub:#667064;--line:#dcdcd2;--accent:#2f6b3a;--accent-ink:#fff;--warn:#c0392b;--road:#f7b4b6}
@media(prefers-color-scheme:dark){:root{--bg:#141813;--card:#1d221c;--ink:#e8ece6;--sub:#9aa597;--line:#33392f;--accent:#3f8a4d;--accent-ink:#fff;--warn:#ff7b6b;--road:#5a3436}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:baseline;gap:10px;padding:8px 14px 0}
.bar h1{font-size:18px;margin:0}
#today{font-size:12px;opacity:.85}
nav{display:flex;gap:2px;padding:6px 8px 0}
nav button{flex:1;max-width:140px;border:0;background:transparent;color:inherit;padding:9px 0;font:inherit;font-size:13px;border-radius:10px 10px 0 0;opacity:.85;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
nav b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px}
nav b:empty{display:none}
main{max-width:1120px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.sub{color:var(--sub);font-size:13px}
.mapgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:860px){.mapgrid{grid-template-columns:440px minmax(0,1fr)}.mapcard{position:sticky;top:96px}}
.mapcard{padding:8px}
.maptool{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:2px 4px 8px}
.maptool select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);flex-basis:100%}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:3px}
.editbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 4px 10px;position:sticky;top:96px;z-index:5;background:var(--card)}
.editbar .hint{flex-basis:100%}
#map{width:100%;height:auto;display:block}
#map.splitting{touch-action:none;cursor:crosshair}
.road{fill:var(--road);stroke:none}
.bed{stroke:var(--ink);stroke-width:1.6;cursor:pointer}
.bed.sel{stroke:var(--accent);stroke-width:5}
.bed.esel{stroke:var(--accent);stroke-width:6;stroke-dasharray:14 7}
.cut{stroke:var(--warn);stroke-width:4;stroke-dasharray:12 6;pointer-events:none}
.lb{font-size:17px;font-weight:700;text-anchor:middle;fill:var(--ink);pointer-events:none}
.lb.s{font-size:14px}
.lc{font-size:13px;text-anchor:middle;fill:var(--ink);pointer-events:none}
.lc.s{font-size:11px}
.wn{font-size:14px;text-anchor:middle;pointer-events:none}
.mapdeco line,.mapdeco path{stroke:var(--sub);stroke-width:1.6;fill:none}
.mapdeco text{fill:var(--sub);font-size:13px;text-anchor:middle}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.badge{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.badge.warn{border-color:var(--warn);color:var(--warn);font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
tr[data-bed]{cursor:pointer}
tr[data-bed]:hover{background:var(--bg)}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.rec.plan{border-style:dashed}
.rh{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.rh .ic{font-size:16px}
.rec p{margin:4px 0 0;white-space:pre-wrap}
.ra{margin-top:8px;display:flex;gap:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tag.late{color:var(--warn);border-color:var(--warn)}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph img,.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg);display:block}
.th{position:relative}
.th .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:15px;line-height:1;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filters select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:16px;padding:14px 20px;box-shadow:0 4px 14px #0004;cursor:pointer}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 20px);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
#f{padding:16px;display:flex;flex-direction:column;gap:12px}
#f label,#f fieldset{display:block;margin:0;font-size:13px;color:var(--sub)}
#f input[type=text],#f input[type=date],#f input[type=number],#f select,#f textarea,#nameIn{display:block;width:100%;margin-top:3px;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#f label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
#f fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{position:relative;display:inline-block!important}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:block;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#ask,#nameDlg{padding:18px}
#ask p,#nameDlg p{margin:0 0 14px}
#viewer{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#viewer img{max-width:96vw;max-height:92vh}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:999px;z-index:60;font-size:14px;max-width:92vw;text-align:center}
.note{font-size:13px;color:var(--sub);margin:8px 0}
.rotbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--bg)}
.rotbox.bad{border-color:var(--warn);color:var(--warn)}
.rotbox.ok{border-color:var(--accent)}
.rotbox div+div{margin-top:4px}
.rot li{margin:3px 0}
ul.plain{margin:6px 0;padding-left:20px;font-size:14px}
.syncchip{margin-left:auto;border:1px solid #fff6;background:#0002;color:#fff;border-radius:999px;font:inherit;font-size:12px;padding:2px 10px;cursor:pointer}
.syncchip.err{background:var(--warn);border-color:var(--warn)}
.card+.card{margin-top:12px}
.fld{display:block;margin:0 0 10px;font-size:13px;color:var(--sub)}
.fld input{display:block;width:100%;margin-top:3px;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#sy-form{max-width:360px}
.cropchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chipbtn small{opacity:.75;margin-left:4px}
.mwrap{overflow-x:auto;margin:6px 0 4px}
.mtab{border-collapse:collapse;width:100%;font-size:12px}
.mtab th,.mtab td{padding:3px 0;text-align:center;border:1px solid var(--line);min-width:20px;line-height:1.4}
.mtab th.rl,.mtab td.rl{text-align:left;min-width:64px;padding:3px 5px;white-space:nowrap;position:sticky;left:0;background:var(--card)}
.mtab th.cur{background:var(--bg);color:var(--ink)}
.mtab .pl{opacity:.4}
details.cult{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}
details.cult>summary{padding:10px 12px;cursor:pointer;list-style:none}
details.cult>summary::-webkit-details-marker{display:none}
details.cult>summary::before{content:'▸ ';color:var(--sub)}
details.cult[open]>summary::before{content:'▾ '}
details.cult .cbody{padding:0 12px 10px}
.dd{font-size:12px;color:var(--sub)}
.mtab .k1,.mtab .k2{display:inline-block;border-radius:4px;font-size:11px;line-height:16px;padding:0 3px;margin:0 1px;color:#1f2a1f}
.mtab .k1{background:#f2e48f}.mtab .k2{background:#9bd7a8}
.mtab td.rl small{color:var(--sub);margin-left:3px}
.mtab.num td,.mtab.num th{min-width:30px;font-size:11px}
.nowlist{font-size:14px;margin:4px 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
#f-type option:disabled{color:#999}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>🥬 畑ノート</h1><span id="today"></span><button type="button" id="syncChip" class="syncchip"></button></div>
  <nav id="tabs">
    <button data-v="map" class="on">畝マップ</button>
    <button data-v="crop">作物別</button>
    <button data-v="log">記録</button>
    <button data-v="plan">予定<b id="planCount"></b></button>
    <button data-v="rot">目安</button>
    <button data-v="data">データ</button>
  </nav>
</header>
<main>
  <section id="v-map" class="view">
    <div class="mapgrid">
      <div class="card mapcard">
        <div class="maptool">
          <label>色分け <select id="mode">
            <option value="crop">作物</option>
            <option value="family">科（連作）</option>
            <option value="fert">施肥の経過</option>
            <option value="spray">散布・収穫制限</option>
          </select></label>
          <button class="btn sm" id="editToggle">✏️ 畝を編集</button>
          <div id="legend"></div>
        </div>
        <div id="editbar" class="editbar" hidden></div>
        <svg id="map" viewBox="205 165 690 1075" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="畝マップ"></svg>
      </div>
      <div id="detail" class="card"></div>
    </div>
  </section>
  <section id="v-log" class="view" hidden>
    <div class="filters">
      <select id="l-bed"></select>
      <select id="l-type"></select>
    </div>
    <div id="l-list"></div>
  </section>
  <section id="v-plan" class="view" hidden>
    <div id="p-list"></div>
  </section>
  <section id="v-crop" class="view" hidden></section>
  <section id="v-rot" class="view" hidden></section>
  <section id="v-data" class="view" hidden>
    <div class="card" id="sy-card">
      <h2>同期（スマホとPC）</h2>
      <p id="sy-status" class="sub"></p>
      <form id="sy-form" hidden>
        <label class="fld">メールアドレス<input type="email" id="sy-mail" autocomplete="username" inputmode="email"></label>
        <label class="fld">パスワード<input type="password" id="sy-pass" autocomplete="current-password"></label>
        <button type="submit" class="btn pri" id="sy-go">ログイン</button>
      </form>
      <div id="sy-on" class="quick" hidden>
        <button type="button" class="btn pri" id="sy-now">今すぐ同期</button>
        <button type="button" class="btn" id="sy-out">ログアウト</button>
      </div>
      <p class="note">記録・畝の形・写真が同期されます。ネットがつながらない場所でも入力でき、つながったときに自動で同期します。ログアウトしても、この端末のデータは消えません。</p>
    </div>
    <div class="card">
      <h2>データ</h2>
      <p id="d-stat" class="sub"></p>
      <p class="note">※ バックアップは、ときどき書き出しておくと安心です。畝の形の変更も含まれます。</p>
      <div class="quick">
        <button class="btn pri" id="d-export">バックアップを書き出す</button>
        <label class="btn">バックアップを読み込む<input type="file" id="d-import" accept="application/json,.json" hidden></label>
      </div>
      <h3>動作確認用</h3>
      <div class="quick">
        <button class="btn" id="d-sample">サンプル記録を入れる</button>
        <button class="btn" id="d-reset">畝の形を最初に戻す</button>
        <button class="btn danger" id="d-clear">全データを消す</button>
      </div>
    </div>
  </section>
</main>

<button id="fab" type="button">＋ 記録する</button>

<dialog id="dlg">
  <form id="f">
    <h2 id="fTitle">記録を追加</h2>
    <div class="row">
      <label>種類<select id="f-type"></select></label>
      <label>日付<input type="date" id="f-date" required></label>
    </div>
    <div id="f-typehint" class="rotbox bad" hidden></div>
    <label class="chk"><input type="checkbox" id="f-plan"> 予定として登録（まだ実施していない）</label>
    <fieldset><legend>対象の畝</legend><div id="f-beds" class="chips"></div></fieldset>
    <label data-t="plant harvest">作物<input type="text" id="f-crop" list="dl-crops" autocomplete="off"></label>
    <div id="f-rot" class="rotbox" hidden></div>
    <div id="f-season" class="rotbox" hidden></div>
    <label data-t="plant">品種<input type="text" id="f-variety" autocomplete="off"></label>
    <label data-t="plant">方法<select id="f-how"><option value="">（指定なし）</option><option value="播種">播種（種をまく）</option><option value="定植">定植（苗を植える）</option><option value="植え付け">植え付け（種芋・球根など）</option></select></label>
    <label data-t="plant">収穫予定日<input type="date" id="f-harvestPlan"></label>
    <div data-t="plant" id="f-af-box"><label class="chk"><input type="checkbox" id="f-af"> 追肥の予定を自動で入れる（目安）</label><div id="f-afprev" class="note"></div></div>
    <label data-t="fert spray soil">資材名<input type="text" id="f-material" list="dl-mats" autocomplete="off"></label>
    <label data-t="fert harvest soil">量<input type="text" id="f-amount" placeholder="例: 100g/㎡、3kg" autocomplete="off"></label>
    <div class="row" data-t="spray">
      <label>希釈倍数<input type="number" id="f-dilution" inputmode="decimal" min="0" placeholder="例: 1000"></label>
      <label>収穫前日数（日）<input type="number" id="f-phi" inputmode="numeric" min="0" placeholder="例: 7"></label>
    </div>
    <label data-t="spray">対象（病害虫など）<input type="text" id="f-target" autocomplete="off"></label>
    <label>メモ<textarea id="f-memo" rows="3"></textarea></label>
    <div>
      <label class="btn" style="display:inline-block;color:var(--ink)">📷 写真を追加<input type="file" id="f-file" accept="image/*" multiple hidden></label>
      <div id="f-photos" class="ph"></div>
    </div>
    <div class="btns">
      <button type="button" class="btn danger" id="f-del" hidden>削除</button>
      <button type="button" class="btn" id="f-cancel">キャンセル</button>
      <button type="submit" class="btn pri">保存</button>
    </div>
  </form>
</dialog>

<dialog id="ask"><p id="askMsg"></p><div class="btns"><button type="button" class="btn" id="askNo">やめる</button><button type="button" class="btn pri" id="askYes">OK</button></div></dialog>
<dialog id="nameDlg"><p>畝の名前</p><input type="text" id="nameIn" autocomplete="off"><div class="btns" style="margin-top:14px"><button type="button" class="btn" id="nameNo">やめる</button><button type="button" class="btn pri" id="nameYes">変更</button></div></dialog>
<div id="viewer" hidden><img alt=""></div>
<div id="toast" hidden></div>
<datalist id="dl-crops"></datalist>
<datalist id="dl-mats"></datalist>

<script src="supabase.js"></script>

function bedInfo(id){
  const rs=S.records.filter(r=>!r.plan&&r.beds.includes(id)).sort(byDate);

  for(const r of rs){if(r.type==='plant')cur=r;else if(r.type==='clear')cur=null}
  const last=t=>[...rs].reverse().find(r=>r.type===t);
  let safeOn=null;
  if(cur)for(const r of rs){if(r.type==='spray'&&r.date>=cur.date&&r.phi!==''&&r.phi!=null){const x=addDays(r.date,+r.phi);if(!safeOn||x>safeOn)safeOn=x}}

}

/* ---------- 連作障害チェック ---------- */
function rotationIssues(bedId,crop,date,ignoreId){
  const c=findCrop(crop);if(!c||!c.y)return[];
  const out=[];
  for(const r of S.records){
    if(r.type!=='plant'||r.plan||r.id===ignoreId||!r.beds.includes(bedId)||r.date>date)continue;
    const p=findCrop(r.crop);if(!p||p.f!==c.f||!p.y)continue;
    const gap=dd(date,r.date)/365.25;
    if(gap<c.y)out.push({prev:r,p,gap,until:addDays(r.date,Math.round(c.y*365.25))});
  }
  return out.sort((a,b)=>a.prev.date<b.prev.date?1:-1);
}
function rotationHTML(id){
  const t=today();
  const plants=S.records.filter(r=>r.type==='plant'&&!r.plan&&r.beds.includes(id)).sort(byDate).reverse();
  if(!plants.length)return'<h3>連作障害チェック</h3><p class="sub">作付けの履歴がないので、連作障害の心配なく植えられます。</p>'+nowOkHTML(CROPS.map(c=>c.n));
  const fam=new Map(),unknown=new Set();
  for(const r of plants){const c=findCrop(r.crop);if(!c){if(r.crop)unknown.add(r.crop);continue}
    if(!c.y||fam.has(c.f))continue;fam.set(c.f,{r,c,until:addDays(r.date,Math.round(c.y*365.25))})}
  const avoid=[...fam.entries()].filter(([,v])=>v.until>t);
  const okCrops=CROPS.filter(c=>!rotationIssues(id,c.n,t).length).map(c=>c.n);
  const ngCrops=CROPS.filter(c=>rotationIssues(id,c.n,t).length).map(c=>c.n);
  let h='<h3>連作障害チェック</h3>';
  h+=avoid.length?`<div class="rotbox bad">${avoid.map(([f,v])=>`<div>⚠ <b>${esc(f)}</b>は ${full(v.until)} ごろまで避けるのが目安（${esc(v.r.crop)} ${full(v.r.date)} 作付け）</div>`).join('')}</div>`:'<div class="rotbox ok">いま避けたほうがいい科はありません。</div>';
  if(ngCrops.length)h+=`<p class="sub" style="margin:8px 0 2px">いま植えると連作になりやすい作物</p><div style="font-size:14px">${esc(ngCrops.join('、'))}</div>`;
  h+=nowOkHTML(okCrops);
  h+=`<p class="sub" style="margin:8px 0 2px">連作の面で問題ない作物（季節は別に考えてください）</p><div style="font-size:14px">${esc(okCrops.join('、'))}</div>`;
  if(unknown.size)h+=`<p class="note">連作データがない作物：${esc([...unknown].join('、'))}</p>`;
  return h;
}

/* ---------- 幾何（結合・分割） ---------- */
const R1=x=>Math.round(x*10)/10;
const key=p=>R1(p[0])+','+R1(p[1]);
const sarea=p=>{let a=0;for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];a+=x0*y1-x1*y0}return a/2};
const ccw=p=>(sarea(p)>=0?p:p.slice().reverse()).map(q=>[R1(q[0]),R1(q[1])]);
function unionPoly(A,B){
  const a=ccw(A),b=ccw(B),E=(poly)=>{const m=new Map();for(let i=0;i<poly.length;i++){const p0=poly[i],p1=poly[(i+1)%poly.length];m.set(key(p0)+'>'+key(p1),[p0,p1])}return m};
  const ea=E(a),eb=E(b);let shared=0;
  for(const k of [...ea.keys()]){const[k0,k1]=k.split('>'),rev=k1+'>'+k0;if(eb.has(rev)){ea.delete(k);eb.delete(rev);shared++}}
  if(!shared)return null;
  const rest=[...ea.values(),...eb.values()],used=new Array(rest.length).fill(false),loops=[];
  for(let s=0;s<rest.length;s++){if(used[s])continue;
    const loop=[rest[s][0]];used[s]=true;let end=key(rest[s][1]),guard=0;
    while(end!==key(loop[0])&&guard++<500){const n=rest.findIndex((e,i)=>!used[i]&&key(e[0])===end);if(n<0)break;used[n]=true;loop.push(rest[n][0]);end=key(rest[n][1])}
    if(end===key(loop[0])&&loop.length>=3)loops.push(loop)}
  if(!loops.length)return null;
  loops.sort((x,y)=>Math.abs(sarea(y))-Math.abs(sarea(x)));
  return loops[0];
}
function simplify(p,keepKeys){let q=p.slice(),ch=true;
  while(ch&&q.length>3){ch=false;for(let i=0;i<q.length;i++){const a=q[(i+q.length-1)%q.length],b=q[i],c=q[(i+1)%q.length];
    if(keepKeys.has(key(b)))continue;
    if(Math.abs((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]))<0.5){q.splice(i,1);ch=true;break}}}
  return q}
function splitPoly(P,a,b){
  const d=[b[0]-a[0],b[1]-a[1]],side=q=>d[0]*(q[1]-a[1])-d[1]*(q[0]-a[0]);
  const A=[],B=[],ints=[];
  for(let i=0;i<P.length;i++){const p0=P[i],p1=P[(i+1)%P.length],s0=side(p0),s1=side(p1);
    (s0>=0?A:B).push(p0);
    if((s0>=0)!==(s1>=0)){const t=s0/(s0-s1),ip=[R1(p0[0]+t*(p1[0]-p0[0])),R1(p0[1]+t*(p1[1]-p0[1]))];A.push(ip);B.push(ip);ints.push(ip)}}
  if(ints.length!==2||A.length<3||B.length<3)return null;
  const aa=Math.abs(sarea(A)),ab=Math.abs(sarea(B)),tot=aa+ab;
  if(aa/tot<0.03||ab/tot<0.03)return null;
  return{A,B,aa,ab,ints};
}
function insertPt(poly,pt){
  for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];
    if(key(pt)===key(p)||key(pt)===key(q))return false;
    const dx=q[0]-p[0],dy=q[1]-p[1],L2=dx*dx+dy*dy;if(!L2)continue;
    const t=((pt[0]-p[0])*dx+(pt[1]-p[1])*dy)/L2;if(t<=0||t>=1)continue;
    const px=p[0]+t*dx,py=p[1]+t*dy;
    if(Math.hypot(pt[0]-px,pt[1]-py)<0.7){poly.splice(i+1,0,pt.slice());return true}}
  return false}

async function eMerge(){
  const bs=[...esel].map(getBed).filter(Boolean).sort((a,b)=>b.area-a.area);
  if(bs.length<2)return;
  const main=bs[0];let acc=main.pts,rest=bs.slice(1);
  while(rest.length){let ok=false;
    for(let i=0;i<rest.length;i++){const u=unionPoly(acc,rest[i].pts);if(u){acc=u;rest.splice(i,1);ok=true;break}}
    if(!ok)return toast('隣り合っていない畝があります。つながっている畝だけ選んでください');}
  const others=bs.slice(1);
  if(!await ask(`${others.map(b=>b.id).join('・')} を ${main.id} に結合します。面積の大きい ${main.id} の情報（作物・履歴）を引き継ぎます。${others.map(b=>b.id).join('・')} だけの記録は「旧」の畝として残ります。`))return;
  snap();
  const keep=new Set();for(const b of active())if(!bs.includes(b))for(const p of b.pts)keep.add(key(p));
  main.pts=simplify(acc,keep);
  main.area=Math.round(bs.reduce((s,b)=>s+b.area,0)*10)/10;
  for(const o of others){o.retired=true;o.mergedInto=main.id}
  esel=new Set([main.id]);afterEdit();toast(`${main.id} に結合しました`);
}
async function eCut(){
  const X=getBed([...esel][0]);if(!X||!cut)return;
  const r=splitPoly(X.pts,cut[0],cut[1]);
  if(!r)return toast('この線では2つに分けられません。畝を横切るように引き直してください');
  snap();
  const a=uniqueId(X.id+'a');const bId=uniqueId(X.id+'b');
  const ar=Math.round(X.area*r.aa/(r.aa+r.ab)*10)/10;
  const nb=[{id:a,area:ar,pts:r.A},{id:bId,area:Math.round((X.area-ar)*10)/10,pts:r.B}];
  const i=S.beds.indexOf(X);S.beds.splice(i,1,...nb);
  for(const o of active())if(!nb.includes(o))for(const ip of r.ints)insertPt(o.pts,ip);
  for(const rec of S.records)if(rec.beds.includes(X.id)){rec.beds=[...new Set(rec.beds.flatMap(id=>id===X.id?[a,bId]:[id]))];rec.u=Date.now()}
  splitMode=false;cut=null;esel=new Set([a,bId]);afterEdit();toast(`${X.id} を ${a} と ${bId} に分けました（履歴は両方に引き継ぎ）`);
}
async function eRename(){
  const X=getBed([...esel][0]);if(!X)return;
  const n=await promptName(X.id);if(n===null||n===X.id)return;
  if(!n)return toast('名前を入力してください');
  if(getBed(n))return toast('その名前はすでに使われています');
  snap();
  for(const r of S.records)if(r.beds.includes(X.id)){r.beds=r.beds.map(id=>id===X.id?n:id);r.u=Date.now()}
  for(const b of S.beds)if(b.mergedInto===X.id)b.mergedInto=n;
  X.id=n;esel=new Set([n]);afterEdit();toast('名前を変更しました');
}
function eUndo(){
  if(!undoSnap)return;const o=JSON.parse(undoSnap);
  const strip=r=>{const c={...r};delete c.u;return JSON.stringify(c)},was=new Map(S.records.map(r=>[r.id,strip(r)]));
  S.beds=o.beds;S.records=o.records;for(const r of S.records)if(was.get(r.id)!==strip(r))r.u=Date.now();undoSnap=null;esel=new Set();splitMode=false;cut=null;afterEdit();toast('元に戻しました');

function fertPlanFor(crop,how,date){
  const c=findCrop(crop),f=c&&FERT_PLAN[c.n];if(!f||!date)return null;
  const shift=(f.b==='定植'&&how==='播種')?(f.raise||0):0;
  return{f,shift,steps:f.steps.map(([d,t])=>({date:addDays(date,d+shift),label:t}))}}
function removeAuto(plantId){const t=Date.now();for(const x of S.records)if(x.src===plantId&&x.plan)S.tomb[x.id]=t;S.records=S.records.filter(x=>!(x.src===plantId&&x.plan))}
function genAuto(r){const p=fertPlanFor(r.crop,r.how,r.date);if(!p)return;
  const doneIdx=new Set(S.records.filter(x=>x.src===r.id&&!x.plan).map(x=>x.si));
  p.steps.forEach((st,i)=>{if(doneIdx.has(i))return;
    S.records.push(blank({type:'fert',date:st.date,plan:true,beds:r.beds.slice(),material:'追肥（目安）',memo:st.label+'\n※日数は目安です。生育を見て調整し、肥料の量は袋の表示に従ってください。',src:r.id,si:i,auto:true}))})}
function updateAf(){
  const cb=$('#f-af'),pv=$('#f-afprev');
  if($('#f-type').value!=='plant'){pv.textContent='';return}
  const crop=$('#f-crop').value.trim(),how=$('#f-how').value,date=$('#f-date').value||today();
  if(!crop){cb.disabled=true;pv.textContent='';return}
  const p=fertPlanFor(crop,how,date);
  if(!p){cb.disabled=true;pv.textContent='この作物の追肥の目安データはありません（追肥が基本不要の作物もあります）。';return}
  cb.disabled=false;
  let h=cb.checked?p.steps.map(st=>`${md(st.date)}　${esc(st.label)}`).join('<br>'):'';
  if(cb.checked&&p.f.b!=='播種'&&!p.shift)h+=`<br>※日数は${esc(p.f.b)}の日から数えます。${p.f.b==='定植'?'種まきの日を入れるときは、方法で「播種」を選んでください。':''}`;
  if(cb.checked&&p.shift)h+=`<br>※播種から定植までの約${p.shift}日ぶんを足して計算しています。`;
  pv.innerHTML=h;
}
function fertCardHTML(){
  const rows=Object.entries(FERT_PLAN).map(([n,f])=>`<tr><td>${esc(n)}</td><td>${esc(f.b)}</td><td>${f.steps.map(([d,t])=>`${d}日　${esc(t)}`).join('<br>')}</td></tr>`).join('');
  return`<div class="card"><h2>追肥の目安</h2>
   <p class="sub">作付けの記録で「追肥の予定を自動で入れる」にすると、この表をもとに予定タブへ入ります。</p>
   <div class="mwrap"><table><thead><tr><th>作物</th><th>起点</th><th>起点からの日数と内容</th></tr></thead><tbody>${rows}</tbody></table></div>
   <h3>資料に書かれていること</h3>
   <ul class="plain">${Object.entries(FERT_PLAN).map(([n,f])=>`<li><b>${esc(n)}</b>：${esc(f.basis)}</li>`).join('')}</ul>

let cropSel=null;
const ICON={soil:'⛏️',plant:'🌱',fert:'🧪',spray:'💧',harvest:'🧺',clear:'🧹',memo:'📝'};
function buildCults(){
  const all=S.records,done=all.filter(r=>!r.plan);
  const plants=done.filter(r=>r.type==='plant').sort(byDate);
  const cults=plants.map(P=>{
    const ends={};
    for(const b of P.beds){
      let e=null;
      for(const r of done){
        if(r.id===P.id||!r.beds.includes(b))continue;
        const after=r.date>P.date||(r.date===P.date&&r.id>P.id);
        let cand=null;
        if(r.type==='plant'&&after)cand={date:r.date,incl:false};
        else if(r.type==='clear'&&r.date>=P.date)cand={date:r.date,incl:true};
        if(cand&&(!e||cand.date<e.date||(cand.date===e.date&&!cand.incl)))e=cand;
      }
      ends[b]=e;
    }
    return{P,key:kata(P.crop),ends,ev:[]};
  });
  const inMain=new Set();
  for(const c of cults)for(const r of all){
    if(r.id===c.P.id||r.type==='plant'||r.date<c.P.date)continue;
    if(r.beds.some(b=>c.P.beds.includes(b)&&(!c.ends[b]||r.date<c.ends[b].date||(r.date===c.ends[b].date&&c.ends[b].incl)))){c.ev.push(r);inMain.add(r.id)}
  }
  for(const c of cults)for(const r of all){   // 作付け前3週間の施肥・散布（基肥など）
    if(inMain.has(r.id)||r.type==='plant'||r.type==='harvest'||r.type==='clear'||r.date>=c.P.date||dd(c.P.date,r.date)>(r.type==='soil'?60:21))continue;
    if(r.beds.some(b=>c.P.beds.includes(b)))c.ev.push(r);
  }
  for(const c of cults)c.ev.sort(byDate);
  return cults;
}
function cultStats(c){
  const ev=c.ev.filter(r=>!r.plan),hv=ev.filter(r=>r.type==='harvest');
  return{fert:ev.filter(r=>r.type==='fert'&&r.date>=c.P.date).length,spray:ev.filter(r=>r.type==='spray').length,
    firstH:hv[0],lastH:hv[hv.length-1],clear:ev.find(r=>r.type==='clear'),plans:c.ev.filter(r=>r.plan).length}
}
function monthRow(c,cm){
  const cells=Array.from({length:12},()=>new Map());
  const add=(r,pl)=>{cells[+r.date.slice(5,7)-1].set(r.type+(pl?'*':''),1)};
  add(c.P,false);for(const r of c.ev)add(r,r.plan);
  const order=['soil','plant','fert','spray','harvest','clear','memo'];
  return`<tr><td class="rl">${esc(c.P.date.slice(0,4))} ${esc(c.P.beds.join('・'))}</td>${cells.map((m,i)=>`<td${i+1===cm?' class="cur"':''}>${order.map(k=>m.has(k)?`<span>${ICON[k]}</span>`:'').join('')}${order.map(k=>m.has(k+'*')?`<span class="pl">${ICON[k]}</span>`:'').join('')}</td>`).join('')}</tr>`;
}
function renderCrop(){
  const root=$('#v-crop'),cults=buildCults();
  if(!cults.length){root.innerHTML='<div class="card"><h2>作物別の履歴</h2><p class="sub">「作付け」の記録を入れると、作物ごとに過去の栽培の履歴が見られます。</p></div>';return}
  const groups=new Map();
  for(const c of cults){let g=groups.get(c.key);if(!g){g={key:c.key,name:c.P.crop,list:[]};groups.set(c.key,g)}g.list.push(c);g.name=c.P.crop}
  const gs=[...groups.values()].sort((a,b)=>a.list[a.list.length-1].P.date<b.list[b.list.length-1].P.date?1:-1);
  if(!cropSel||!groups.has(cropSel))cropSel=gs[0].key;
  const g=groups.get(cropSel),list=g.list.slice().reverse(),fam=findCrop(g.name),cm=new Date().getMonth()+1;
  const years=[...new Set(list.map(c=>c.P.date.slice(0,4)))].sort();
  root.innerHTML=`<div class="cropchips">${gs.map(x=>`<button class="chipbtn${x.key===cropSel?' on':''}" data-crop="${esc(x.key)}">${esc(x.name)}<small>${x.list.length}</small></button>`).join('')}</div>
   <div class="card"><h2>${esc(g.name)}${fam?` <span class="sub">${esc(fam.f)}</span>`:''}</h2>
    <div class="sub">${list.length}回の栽培（${years[0]}${years.length>1?'〜'+years[years.length-1]:''}年）</div>
    <h3>月ごとの作業（年ごとの比較）</h3>
    <div class="mwrap"><table class="mtab"><thead><tr><th class="rl"></th>${Array.from({length:12},(_,i)=>`<th${i+1===cm?' class="cur"':''}>${i+1}</th>`).join('')}</tr></thead><tbody>${list.map(c=>monthRow(c,cm)).join('')}</tbody></table></div>
    <div class="dd">⛏️土づくり　🌱作付け　🧪施肥　💧散布　🧺収穫　🧹片付け（薄い表示は予定）</div>
    <h3>栽培ごとの記録</h3>
    ${list.map((c,i)=>{const st=cultStats(c),P=c.P;
      const sum=[`畝 ${P.beds.map(bedLabel).join('・')}`,st.firstH?`初収穫 ${md(st.firstH.date)}（${dd(st.firstH.date,P.date)}日目）`:'収穫の記録なし',`施肥${st.fert}回`,`散布${st.spray}回`,st.clear?`片付け ${md(st.clear.date)}`:'栽培中'];
      if(st.plans)sum.push(`予定${st.plans}件`);
      return`<details class="cult"${i===0?' open':''}><summary><b>${esc(P.date.slice(0,4))}年 ${md(P.date)} ${esc(P.how||'作付け')}</b>${P.variety?'（'+esc(P.variety)+'）':''}<div class="dd">${sum.join('／')}</div></summary><div class="cbody">${st.clear?'':`<button class="btn sm pri" data-addto="${P.id}">＋ この栽培に記録を追加</button>`}${recHTML(P,true)}${c.ev.map(r=>recHTML(r,true,P.date)).join('')}</div></details>`}).join('')}
   </div>`;
  hydrate(root);
}

    const remote=new Map();
    for(let from=0;;from+=1000){
      const{data,error}=await sb.from('garden_records').select('id,data,deleted,updated_at').order('id').range(from,from+999);
      if(error)throw error;
      for(const row of data)remote.set(row.id,{id:row.id,data:row.data,deleted:row.deleted,u:Date.parse(row.updated_at)});
      if(data.length<1000)break}
    // 2. 新しいほうを採用して取り込む
    for(const[id,R]of remote){
      const L=S.records.find(x=>x.id===id),T=S.tomb[id];
      if(R.deleted){
        if(L&&L.u>R.u)continue;
        if(L){S.records=S.records.filter(x=>x.id!==id);changed=true}
        if((T||0)<R.u)S.tomb[id]=R.u;
      }else{
        if(T&&T>=R.u)continue;
        if(!L||R.u>L.u){const rec={...R.data,u:R.u};if(L)S.records[S.records.indexOf(L)]=rec;else S.records.push(rec);delete S.tomb[id];changed=true}
      }}
    // 畝の形
    const{data:bd,error:be}=await sb.from('garden_beds').select('data,updated_at').maybeSingle();
    if(be)throw be;
    const bu=bd?Date.parse(bd.updated_at):0;
    if(bd&&bu>S.bu&&!editMode&&bd.data&&Array.isArray(bd.data.beds)){S.beds=bd.data.beds;S.bu=bu;changed=true}
    // 3. 自分のほうが新しいものを送る
    const rows=[];
    for(const r of S.records){const R=remote.get(r.id);if(!R||r.u>R.u)rows.push({user_id:uid,id:r.id,data:r,deleted:false,updated_at:iso(r.u)})}
    for(const[id,u]of Object.entries(S.tomb)){const R=remote.get(id);if(!R||u>R.u)rows.push({user_id:uid,id,data:{},deleted:true,updated_at:iso(u)})}
    for(let i=0;i<rows.length;i+=200){const{error}=await sb.from('garden_records').upsert(rows.slice(i,i+200),{onConflict:'user_id,id'});if(error)throw error}
    if(S.bu>bu){const{error}=await sb.from('garden_beds').upsert({user_id:uid,data:{beds:S.beds},updated_at:iso(S.bu)},{onConflict:'user_id'});if(error)throw error}
    // 4. 写真
    for(const r of S.records)for(const id of r.photos||[]){
      if(S.up[id])continue;const b=await getLocalPhoto(id);if(!b)continue;
      const{error}=await sb.storage.from('photos').upload(uid+'/'+id+'.jpg',b,{contentType:'image/jpeg',upsert:true});
      if(error)throw error;S.up[id]=1;persist()}
    if(S.pdel.length){const ids=[...new Set(S.pdel)],{error}=await sb.storage.from('photos').remove(ids.map(i=>uid+'/'+i+'.jpg'));if(error)throw error;S.pdel=[]}
    persist();lastSync=Date.now();setChip('ok');
    if(changed)renderAll();
  }catch(e){setChip('err',errText(e))}
  finally{syncing=false;if(again){again=false;schedSync(500)}}
}
async function initAuth(){
  renderSync();if(!sb)return;
  try{const{data}=await sb.auth.getSession();session=data.session}catch(e){}
  sb.auth.onAuthStateChange((ev,s)=>{session=s;setTimeout(()=>{renderSync();if(s)sync()},0)});
  renderSync();if(session)sync();
  addEventListener('online',()=>schedSync(500));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedSync(500)});
  setInterval(()=>{if(!document.hidden)schedSync(100)},5*60e3);
}
$('#sy-form').addEventListener('submit',async e=>{
  e.preventDefault();const em=$('#sy-mail').value.trim(),pw=$('#sy-pass').value;if(!em||!pw||!sb)return;
  $('#sy-go').disabled=true;
  let error=null;try{({error}=await sb.auth.signInWithPassword({email:em,password:pw}))}catch(x){error=x}
  $('#sy-go').disabled=false;
  if(error)return toast(/Invalid login/i.test(error.message||'')?'メールアドレスかパスワードが違います':'ログインできませんでした：'+errText(error));
  $('#sy-pass').value='';toast('ログインしました');
});
$('#sy-now').onclick=()=>{clearTimeout(syncT);sync().then(()=>{if(chipState==='ok')toast('同期しました')})};
$('#sy-out').onclick=async()=>{if(!await ask('ログアウトします。この端末のデータは残ります。'))return;try{await sb.auth.signOut()}catch(e){}session=null;chipState='';renderSync();toast('ログアウトしました')};
$('#syncChip').onclick=()=>{showView('data');if(session)schedSync(100)};

/* ---------- 初期化 ---------- */
$('#f-type').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('');
$('#l-type').innerHTML='<option value="">すべての種類</option>'+Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
$('#l-type').onchange=$('#l-bed').onchange=renderLog;
$('#today').textContent=full(today());
renderRot();renderAll();initAuth();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
